syntax = "proto3";

package storage;

option go_package = "github.com/vishu-commits7/distributed-raft-storage/pkg/proto";

service StorageService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Set(SetRequest) returns (SetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Scan(ScanRequest) returns (stream ScanResponse);
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  string value = 1;
  bool found = 2;
}

message SetRequest {
  string key = 1;
  string value = 2;
}

message SetResponse {
  bool success = 1;
  string error = 2;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool success = 1;
  string error = 2;
}

message ScanRequest {
  string prefix = 1;
  int32 limit = 2;
}

message ScanResponse {
  string key = 1;
  string value = 2;
}
